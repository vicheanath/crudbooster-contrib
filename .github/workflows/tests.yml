name: tests

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        exclude:
          # Laravel 13 requires PHP 8.3+
          - php: '8.2'
            laravel: '13'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, zip, pdo_sqlite, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  mysql:
    runs-on: ubuntu-latest
    name: MySQL / PHP 8.5 / Laravel 13

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: crudbooster_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, gd, zip, pdo_mysql, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          CB_TEST_DB: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: crudbooster_test
          DB_USERNAME: root
          DB_PASSWORD: ''

  coverage:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    name: Coverage

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, gd, zip, pdo_sqlite, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-text --only-summary-for-coverage-text --coverage-clover build/clover.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: build/clover.xml

  # The Tailwind theme's React components (TypeScript, shadcn/ui on Base UI), and a check that the
  # committed build in src/assets/panel matches its sources (npm run panel:build).
  panel-assets:
    runs-on: ubuntu-latest
    name: Panel assets (TypeScript + shadcn)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run panel:typecheck

      - name: Component tests
        run: npm run panel:test

      - name: Build
        run: npm run panel:build

      - name: The committed build is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/assets/panel)" ]; then
            git status --short -- src/assets/panel
            echo "::error::src/assets/panel is out of date. Run npm run panel:build and commit the result."
            exit 1
          fi
