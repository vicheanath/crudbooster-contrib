name: Bug report
description: Something in CRUDBooster doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Include the error message and stack trace.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a module for table ...
        2. Open /admin/...
        3. ...
    validations:
      required: true
  - type: input
    id: crudbooster
    attributes:
      label: CRUDBooster version
      description: Output of `php artisan crudbooster:version`
    validations:
      required: true
  - type: input
    id: laravel
    attributes:
      label: Laravel version
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [MySQL, MariaDB, PostgreSQL, SQLite, Other]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Relevant module controller code (cbInit), screenshots, browser if it's a UI issue.
